            margin: 0;

        .fix-container {

            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 30px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .message {

            padding: 20px;
            border-radius: 10px;
            display: none;
        }
        .success {

            color: #155724;
